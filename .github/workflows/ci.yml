# Tests and type checks on every push and pull request, so a broken test is seen at once.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Type check (server)
        run: npx tsc --noEmit -p server
      - name: Build (web, with its type check)
        run: npm run build -w web
