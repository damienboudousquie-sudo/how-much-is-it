services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - app-cache:/app/cache
    expose:
      - "3001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # "tondomaine.eu, www.tondomaine.eu" for HTTPS, or ":80" to answer on the IP.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy-data:/data

volumes:
  app-cache:
  caddy-data:
